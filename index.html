<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencatatan Sisa Gudang - Compact Neumorphism</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <div class="header-badge">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
        Sistem Inventaris Gudang
      </div>
      <h1>Pencatatan Sisa Gudang</h1>
      <p>Kalkulasi otomatis saat memilih satuan. Hasil ringkasan siap disalin langsung di bagian bawah.</p>
    </header>

    <!-- Grid Kartu Barang -->
    <main id="inventory-grid" class="inventory-grid"></main>

    <!-- Section Catatan Ringkasan (Neumorphism Smooth) -->
    <section class="copy-section neu-card-lg">
      <div class="copy-header">
        <div class="copy-title-wrapper">
          <div class="copy-icon-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
          </div>
          <div>
            <h2>Catatan Ringkasan Stok</h2>
            <p class="copy-subtitle">Otomatis terhitung & siap langsung disalin</p>
          </div>
        </div>
        <button id="btn-copy" class="btn-copy">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          <span id="copy-text-btn">Salin Catatan</span>
        </button>
      </div>

      <div class="textarea-wrapper">
        <textarea id="summary-text" readonly placeholder="Memuat catatan ringkasan stok..."></textarea>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
