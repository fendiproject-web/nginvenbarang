<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Pencatatan Sisa & Kurangan Gudang</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <!-- Banner Utama (Selalu Muncul) -->
    <div class="banner-box">
      <picture>
        <source srcset="banner.webp" type="image/webp">
        <img src="banner.png" alt="Banner Gudang">
      </picture>
    </div>

    <!-- Tab 1: Stok Gudang -->
    <div id="tab-stok" class="tab-content active">
      <main id="inventory-grid" class="inventory-grid"></main>
    </div>

    <!-- Tab 2: Kurangan Stok (Perkalian Manual Tanpa Dropdown) -->
    <div id="tab-kurangan" class="tab-content">
      <div class="kurangan-card neu-card">
        <div class="table-responsive">
          <table class="kurangan-table">
            <thead>
              <tr>
                <th>Nama Barang</th>
                <th class="text-center">Input 1</th>
                <th class="text-center">×</th>
                <th class="text-center">Input 2</th>
                <th class="text-right">Total Kurangan</th>
              </tr>
            </thead>
            <tbody id="kurangan-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab Bar Bawah -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="tab-stok">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
      <span>Stok Gudang</span>
    </button>
    <button class="nav-btn" data-tab="tab-kurangan">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M9 14h6"/></svg>
      <span>Kurangan Stok</span>
    </button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
