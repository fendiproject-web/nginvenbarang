<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencatatan Sisa Gudang - Glassmorphism</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Background Glow Effect -->
  <div class="glow-bg blob-1"></div>
  <div class="glow-bg blob-2"></div>
  <div class="glow-bg blob-3"></div>

  <div class="app-container">
    <header class="app-header">
      <h1>📦 Pencatatan Sisa Gudang</h1>
      <p>Setiap barang sudah tersedia. Tambah baris input jika barang berada di beberapa tempat terpisah.</p>
    </header>

    <!-- Kontainer Semua Tabel Barang -->
    <main id="items-container" class="items-grid"></main>
  </div>

  <script src="script.js"></script>
